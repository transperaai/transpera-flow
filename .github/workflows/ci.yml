name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      POSTGREST_URL: http://localhost:3000
      POSTGREST_JWT_SECRET: ci-only-postgrest-jwt-secret-for-throwaway-tests
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser determinism test
        run: pnpm --filter @transpera-flow/engine exec playwright-core install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      # Supabase's Data API server (PostgREST, the version Supabase runs) for
      # the MCP end-to-end test, started once its database is ready. The JWT
      # secret only signs test tokens for this throwaway container.
      - name: Start PostgREST for the MCP end-to-end test
        run: |
          (cd packages/mcp && node --experimental-strip-types test/postgrest-db.ts)
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:authenticator@localhost:5432/transpera_flow_postgrest \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon -e PGRST_SERVER_PORT=3000 \
            -e PGRST_JWT_SECRET="$POSTGREST_JWT_SECRET" \
            postgrest/postgrest:v14.18
      - run: pnpm test
      - name: PostgREST logs
        if: always()
        run: docker logs postgrest || true
      - run: pnpm --filter @transpera-flow/web build

  # Which pushes need the visual job: see docs/visual-regression.md.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.f.outputs.visual }}
      update: ${{ steps.f.outputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          subject=$(git log -1 --format=%s)
          update=false
          if [ "$GITHUB_REF" != "refs/heads/main" ] && printf '%s' "$subject" | grep -qF '[visual-update]'; then update=true; fi
          if [ "$update" = true ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then visual=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(apps/web/(src|stories|\.storybook|visual|package\.json|postcss)|packages/(engine|db)/src/|pnpm-lock\.yaml|\.github/workflows/)'; then visual=true
          else visual=false; fi
          echo "visual=$visual" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

  # Screenshots of every Storybook story in both themes, compared with the committed baselines. Runs in the pinned Playwright
  # image so the pixels are the same every time; the image tag must equal the @playwright/test version (the config checks).
  visual:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      VISUAL_BASELINES: "1"
      PLAYWRIGHT_IMAGE: v1.63.0-noble
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @transpera-flow/web build-storybook
      - name: Compare with the baselines
        if: needs.changes.outputs.update != 'true'
        run: pnpm --filter @transpera-flow/web visual
      - name: Update the baselines, check they are stable, commit them
        id: update
        if: needs.changes.outputs.update == 'true'
        run: |
          pnpm --filter @transpera-flow/web visual:update
          pnpm --filter @transpera-flow/web visual
          git add -A apps/web/visual/__screenshots__
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update visual baselines" -m "Regenerated in the pinned Playwright image from $(git rev-parse --short HEAD)."
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::The new baselines could not be pushed (GITHUB_TOKEN may be read-only for this repository). They are in the visual-baselines artifact: unzip it into apps/web/visual/__screenshots__/ and commit it."
            exit 1
          fi
      - name: Upload the regenerated baselines (the push was refused)
        if: failure() && steps.update.outputs.pushed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/visual/__screenshots__
          retention-days: 7
      - name: List the failing stories
        if: failure() && needs.changes.outputs.update != 'true'
        run: |
          {
            echo "### Visual differences"
            echo "Failing stories (see the visual-report artifact for expected, actual and diff). If the change is intended, push a commit with [visual-update] in its subject (docs/visual-regression.md)."
            echo
            ls apps/web/test-results 2>/dev/null | grep -v '^\.' | sed 's/^stories-/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
