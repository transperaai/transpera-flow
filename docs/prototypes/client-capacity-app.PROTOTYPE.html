<title>Transpera Flow Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app shell — fixed left nav (top bar on phones), main column of dense cards; numbers in mono. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef0f4; --fg:#18202b; --muted:#5d6878; --line:#dde1e8;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --accent-fg:#ffffff;
  --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b3362c; --bad-soft:#f9e1de;
  --auto:#1f5f8b; --aug:#6a9fc6; --man:#c9cfd8; --new:#7a4fb0; --new-soft:#efe7f8;
  --c1:#1f5f8b; --c2:#d0782a; --c3:#3f9a6b; --c4:#8a5bb8; --c5:#c4475a; --c6:#2a9bb0; --c7:#9a8a2e; --c8:#6b7685;
  --font:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#18202a; --sunk:#1f2833; --fg:#e7ecf2; --muted:#9aa6b5; --line:#2c3644;
  --accent:#6fb0de; --accent-soft:#1d3346; --accent-fg:#0d1620;
  --ok:#6cc595; --ok-soft:#173326; --warn:#e2b155; --warn-soft:#3a2d12; --bad:#ef8a7f; --bad-soft:#3d1c19;
  --auto:#6fb0de; --aug:#3f6f93; --man:#3a4554; --new:#b996e6; --new-soft:#2c2240;
  --c1:#6fb0de; --c2:#ef9a52; --c3:#6cc595; --c4:#b996e6; --c5:#ef8a9a; --c6:#5cc6d8; --c7:#d4c264; --c8:#9aa6b5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#18202a; --sunk:#1f2833; --fg:#e7ecf2; --muted:#9aa6b5; --line:#2c3644;
  --accent:#6fb0de; --accent-soft:#1d3346; --accent-fg:#0d1620;
  --ok:#6cc595; --ok-soft:#173326; --warn:#e2b155; --warn-soft:#3a2d12; --bad:#ef8a7f; --bad-soft:#3d1c19;
  --auto:#6fb0de; --aug:#3f6f93; --man:#3a4554; --new:#b996e6; --new-soft:#2c2240;
  --c1:#6fb0de; --c2:#ef9a52; --c3:#6cc595; --c4:#b996e6; --c5:#ef8a9a; --c6:#5cc6d8; --c7:#d4c264; --c8:#9aa6b5; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:13px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:8px;align-items:center;padding:4px 8px 14px;font-weight:600}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:block}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 8px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--fg)}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:99px;white-space:nowrap}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.chg{background:var(--accent-soft);color:var(--accent)}
.tag.hid{background:var(--sunk);color:var(--muted)}
.main{min-width:0;padding-block:20px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:12.5px;margin-bottom:16px}
.banner b{color:var(--warn)}
.banner button{margin-left:auto}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.head p{color:var(--muted);margin-top:4px;max-width:70ch}
.answers{display:flex;flex-wrap:wrap;gap:6px}
.answers span{font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 9px;color:var(--muted)}
.answers span b{color:var(--fg);font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card>h2,.card>.ch{margin-bottom:10px}
.ch{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.ch p{color:var(--muted);font-size:12.5px}
.sec{margin-top:14px}
.tw{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sub td{background:var(--sunk);font-weight:600;font-size:12px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.t{background:var(--sunk);color:var(--fg);font-weight:500}
.busy{display:flex;align-items:center;gap:8px;min-width:150px}
.busy .bar{position:relative;flex:1;height:9px;background:var(--sunk);border-radius:99px;overflow:visible}
.busy .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.busy .bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.busy .num{width:44px;text-align:right;font-size:12.5px}
.ok-c{background:var(--ok)} .warn-c{background:var(--warn)} .bad-c{background:var(--bad)}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.x{border:0;background:none;color:var(--muted);padding:2px 6px}
input[type=number],input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:13px;max-width:100%}
input[type=number]{width:78px;font-family:var(--mono)}
input.w{width:140px}
input[type=range]{width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f>span{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin-top:10px}
.note b{color:var(--fg);font-weight:600}
details.how{margin-top:12px;font-size:12.5px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--accent);font-weight:500;width:max-content}
details.how p{margin-top:6px;max-width:100ch}
details.how b{color:var(--fg);font-weight:600}
.big{font-size:16px;line-height:1.45}
.big b{font-weight:600}
.gtrack{position:relative;height:14px;background:var(--sunk);border-radius:99px}
.gfill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.gmark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--muted)}
.gmark.lim{background:var(--fg);width:3px}
.gleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.gleg .lim{color:var(--fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border-radius:99px;padding:3px 10px;border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft)} .chip.ok b{color:var(--ok)}
.chip.bad{background:var(--bad-soft)} .chip.bad b{color:var(--bad)}
.team{border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.dumbs{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.dumb{display:flex;align-items:center;gap:10px}
.dtrack{position:relative;flex:1;height:14px}
.dtrack::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--sunk)}
.dline{position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.6}
.dseg{position:absolute;top:6px;height:2px;opacity:.6}
.ddot{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:99px}
.ddot.from{border:2px solid var(--muted);background:var(--surface)}
.dumb .num{width:96px;text-align:right}
.mrows{display:grid;gap:6px;margin-top:12px}
.mrow{display:grid;grid-template-columns:190px minmax(0,1fr) 140px;gap:12px;align-items:center;font-size:13px}
.mini{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:34px;align-items:end;background:var(--sunk);border-radius:4px;padding:2px}
.mini i{display:block;border-radius:2px 2px 0 0;min-height:2px}
.mline{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--fg);opacity:.5}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
ul.todo{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.okc{color:var(--ok);font-weight:600}
.sbx{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.levers{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:14px}
.lg{display:grid;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.lg h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lever{display:grid;gap:2px;font-size:12.5px}
.lever b{color:var(--accent)}
.row.li{gap:6px;align-items:center;font-size:12.5px}
.results{min-width:0}
.verdict{border-left:4px solid var(--accent)}
.verdict ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
details.card summary{cursor:pointer}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:12.5px}
.ptabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.node.swapped{border-color:var(--new);box-shadow:0 0 0 2px var(--new-soft)}
.node select{width:100%}
.tok{display:none}
#cmap.playing .tok{display:block;position:absolute;left:10px;bottom:6px;width:8px;height:8px;border-radius:99px;background:var(--new);animation:tok 1.6s linear infinite}
@keyframes tok{from{left:10px}to{left:calc(100% - 18px)}}
@media (prefers-reduced-motion:reduce){#cmap.playing .tok{animation:none}}
.hm{border-collapse:separate;border-spacing:2px;font-size:11.5px}
.hm td{border:0;padding:0;text-align:center;font-family:var(--mono);height:24px;min-width:40px;border-radius:3px}
.hm th{border:0;padding:2px 4px;font-weight:500}
.hm td.name{text-align:left;font-family:var(--font);padding-right:8px;white-space:nowrap;min-width:0}
.hm td.onb{outline:2px solid var(--new);outline-offset:-2px}
.map{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.node{flex:0 0 200px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;position:relative}
.node:hover{border-color:var(--accent)}
.node.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.node h3{font-size:12.5px;margin-bottom:4px}
.node .who{font-size:11.5px;color:var(--muted)}
.node .hrs{font-family:var(--mono);font-size:12px;margin:6px 0 4px}
.node .arrow{position:absolute;right:-10px;top:50%;width:10px;height:2px;background:var(--line)}
.inspector{border-left:3px solid var(--accent);margin-top:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.chgcard{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px;background:var(--surface)}
.chgcard .ct{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chgcard .ct b{font-weight:600;font-size:13px}
.kind{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scen{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.scen button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer}
.scen button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cmpchk{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-left:4px}
.answer{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.answer b{font-weight:600}
.svgc{width:100%;height:auto;display:block}
.svgc text{fill:var(--muted);font-family:var(--mono);font-size:15px}
.cmp td:first-child{min-width:190px}
.list{display:grid;gap:8px}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:99px;display:inline-block}
details.nc summary{cursor:pointer}
details.nc[open]{background:var(--sunk)}
.flag{color:var(--bad);font-weight:600}
@media (max-width:1100px){.sbx{grid-template-columns:1fr}.levers{position:static;max-height:none}}
@media (max-width:900px){.g2,.g3,.cols{grid-template-columns:1fr}.mrow{grid-template-columns:110px minmax(0,1fr)}.mrow>span:last-child{grid-column:2}.drow{grid-template-columns:90px minmax(0,1fr)}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .nav .grp,.brand{display:none}
  .nav a{white-space:nowrap;flex:none}
  .nav a .tag{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:no-preference){.busy .bar i{transition:width .25s}}
</style>

/* ---------- calculator ---------- */
function role(p) { return S.roles[p.role]; }
function isCF(p) { return role(p).kind === 'cf'; }
function canServe(p, tier) { return (p.tiers || '').split(' ').includes(tier); }
function availH(p, m) {
  if (p.gone) return 0;
  if (m != null && p.end != null && m >= p.end) return 0;
  if (m != null && p.start != null && m < p.start) return 0;
  let ramp = 1;
  if (m != null && p.start > 0) { const k = m - p.start; ramp = k < 1 ? 0.4 : k < 2 ? 0.6 : k < 3 ? 0.8 : 1; }
  return p.hpw * WEEKS * (1 - S.leave) * (1 - (p.mgmt || 0)) * ramp;
}
function activeChanges(changes, m) {
  const out = [];
  for (const c of changes) {
    if (c.type !== 'lib' && c.type !== 'steptime') continue;
    if (m != null && m < (c.start || 0)) continue;
    let ramp = 1;
    if (m != null && c.ramp) ramp = Math.min(1, (m - (c.start || 0) + 1) / (c.ramp + 1));
    out.push({ ...c, ramp });
  }
  return out;

function pageOverview() {

        <div class="kpi"><div class="k">Room for more clients</div><div class="v">${f0(Math.max(0, cap.max - cl))}</div><div class="s">Limit: ${cap.limit.toLowerCase()}</div></div>
      </div>
      <div class="grid g2"><div><h3 style="margin-bottom:6px">Busiest people</h3><table><tbody>${ppl.slice(0, 6).map(x => `<tr><td>${esc(x.p.name)}<div class="small muted">${esc(x.p.title)}</div></td><td style="width:50%">${busyBar(x.busy, thr(x.p))}</td></tr>`).join('')}</tbody></table></div>
      <div><h3 style="margin-bottom:6px">Where the time goes <span class="muted small num">${f0(tot)} h a month</span></h3><table><tbody>${pt.map(([k, v]) => `<tr><td>${k}</td><td style="width:45%"><div class="split"><i style="width:${v * 100 / pt[0][1]}%;background:var(--accent)"></i></div></td><td class="n">${f0(v)} h</td><td class="n muted">${pc(v / tot)}</td></tr>`).join('')}</tbody></table></div></div></div>`;

    <div class="kpi"><div class="k">Revenue per employee</div><div class="v">${money(revT / empT)}</div><div class="s">a month, ${empT} people</div></div>

function how(works, tells) { return `<details class="how"><summary>How this works</summary><p>${works}</p><p><b>What it tells you:</b> ${tells}</p></details>`; }
function roleBusy(rec, r) {
  const xs = rec.people.filter(p => p.role === r).map(p => rec.L[p.id]).filter(x => x && x.avail > 0);
  if (!xs.length) return 0;
  return xs.reduce((s, x) => s + x.busy * x.avail, 0) / xs.reduce((s, x) => s + x.avail, 0);
}
function roleLabel(r) { const x = S.roles[r]; return x.kind === 'cf' ? (x.dept === 'org' ? 'Organic ' : 'Performance ') + (r.startsWith('dir') ? 'Director' : 'managers') : x.name; }
function stackBar(parts) {
  const tot = parts.reduce((s, p) => s + p.v, 0) || 1;
  return `<div class="stack">${parts.map((p, i) => `<i style="width:${p.v * 100 / tot}%;background:var(--c${(i % 8) + 1})" title="${esc(p.k)} ${f1(p.v)} h"></i>`).join('')}</div><div class="legend" style="margin-top:6px">${parts.map((p, i) => `<span style="--c:var(--c${(i % 8) + 1})">${esc(p.k)} <b class="num">${f1(p.v)}</b></span>`).join('')}</div>`;
}
function dumbbell(a, b, t) {
  const sc = v => Math.min(100, v * 100 / 1.3), c = cls(b, t);
  const lo = Math.min(sc(a), sc(b)), hi = Math.max(sc(a), sc(b));
  return `<div class="dumb"><div class="dtrack"><b class="dline" style="left:${t * 100 / 1.3}%"></b><i class="dseg ${c}-c" style="left:${lo}%;width:${hi - lo}%"></i><i class="ddot from" style="left:${sc(a)}%"></i><i class="ddot to ${c}-c" style="left:${sc(b)}%"></i></div><span class="num small">${pc(a)} → <b class="${c === 'bad' ? 'flag' : ''}">${pc(b)}</b></span></div>`;
}
function miniBars(vals, t) {
  return `<div class="mini">${vals.map((b, i) => `<i class="${cls(b, t)}-c" style="height:${Math.min(100, b * 100 / 1.3)}%" title="${MONTHS[i]}: ${pc(b)}"></i>`).join('')}<b class="mline" style="bottom:${t * 100 / 1.3}%"></b></div>`;
}

function pageCapacity() {
  const { st, L, pool } = computeToday();
  const sim = simulate([]);
  let h = head('Capacity', 'Are we at capacity, who has room, and how many more clients fit. "Today" is a normal month with no onboarding, after the December resignation is handed over.', [['A1', 'Add clients (Sandbox)'], ['A2', 'At capacity?'], ['A3', 'Bottlenecks'], ['A4', 'Time per client'], ['A6', 'DLER'], ['A8', 'When to hire'], ['A9', 'If someone leaves']]);
  const ln = lines(st, L);
  const rv = d => revenue(st.people, st.named, d, {}), sl = d => salaries(st.people, null, d);
  h += `<div class="kpis">
    <div class="kpi"><div class="k">Clients with Organic services</div><div class="v">${f0(ln.org)}</div><div class="s">named and counted</div></div>

    <div class="kpi"><div class="k">DLER Performance</div><div class="v">${f1(rv('perf') / sl('perf'))}</div><div class="s">${money(rv('perf'))} ÷ ${money(sl('perf'))} · goal 4.5</div></div>

  // 1. Room for more clients, per department
  const cp = { org: capDept(st, 'org'), perf: capDept(st, 'perf') };
  h += `<div class="grid g2 sec">` + Object.keys(DEPTS).map(d => {

    const top = Math.max(c.clients, ...lims.map(l => l.max)) * 1.08;
    const x = v => Math.min(100, v * 100 / top);
    const who = c.limit === 'Client-facing people' ? 'its client managers' : 'the ' + c.limit.toLowerCase();
    const cf = st.people.filter(p => isCF(p) && role(p).dept === d && !p.gone).map(p => ({ p, room: personMax(L[p.id]) - L[p.id].clients })).sort((a, b) => b.room - a.room);
    return `<div class="card"><div class="ch"><h2>${DEPTS[d]}: room for more clients</h2></div>
      <div class="big">${room < 1 ? `<span class="flag">Full.</span> ${DEPTS[d]} can't take another client without someone going over their line.` : `${DEPTS[d]} can take about <b>${room} more clients</b>.`}</div>
      <p class="small muted" style="margin:4px 0 12px">${f0(c.clients)} clients today. The ceiling is ${f0(c.max)}, set by ${who}.</p>
      <div class="gtrack"><i class="gfill ${room < 1 ? 'bad' : room < 5 ? 'warn' : 'ok'}-c" style="width:${x(c.clients)}%"></i>${lims.map((l, i) => `<b class="gmark ${i === 0 ? 'lim' : ''}" style="left:${x(l.max)}%" title="${esc(l.name)}: ${f0(l.max)}"></b>`).join('')}</div>
      <div class="gleg">${lims.map((l, i) => `<span class="${i === 0 ? 'lim' : ''}">${i === 0 ? '▲ ' : ''}${esc(l.name)} <b class="num">${f0(l.max)}</b></span>`).join('')}</div>
      <h3 style="margin:16px 0 8px">Who can take the next client</h3>
      <div class="chips">${cf.map(x => `<span class="chip ${x.room >= 1 ? 'ok' : 'bad'}">${esc(x.p.name)} <b>${x.room >= 1 ? '+' + Math.floor(x.room) + ' more' : Math.abs(x.room) < 0.5 ? 'at the line' : Math.ceil(-x.room) + ' over'}</b></span>`).join('')}</div>
      ${how('Each manager\'s ceiling is how many clients of their current mix they could hold before reaching their line. The department ceiling adds those up, then checks each shared team (content, links, tech, implementers): how many clients could it serve at its own line? The lowest figure is the ceiling. The marks on the bar are each of those limits.', 'whether the department can take on work, which team stops it, and who should get the next client.')}
    </div>`;
  }).join('') + `</div>`;

  // 2. People tables
  for (const d in DEPTS) {
    const cf = st.people.filter(p => isCF(p) && role(p).dept === d && !p.gone);
    h += `<div class="card sec"><div class="ch"><h2>${DEPTS[d]}: client-facing people</h2></div><div class="tw"><table><thead><tr><th>Person</th><th>Clients</th><th class="n">Can take</th><th class="n">Rule</th>${d === 'perf' ? '<th class="n">Channels</th>' : ''}<th class="n">Hours needed</th><th class="n">Available</th><th style="min-width:180px">Busy against line</th></tr></thead><tbody>` +
      cf.map(p => { const x = L[p.id]; const rl = role(p).rule; const rm = personMax(x) - x.clients; return `<tr><td>${esc(p.name)}<div class="small muted">${esc(p.title)}${p.mgmt ? ' · ' + pc(p.mgmt) + ' team time' : ''}</div></td><td>${f0(x.clients)} <span class="small">${tierChips(x.t)}</span></td><td class="n ${rm < -0.5 ? 'flag' : ''}">${rm >= 1 ? '+' + Math.floor(rm) : Math.abs(rm) < 0.5 ? '0' : Math.ceil(-rm) + ' over'}</td><td class="n ${rl && x.clients > rl ? 'flag' : 'muted'}">${rl || '—'}</td>${d === 'perf' ? `<td class="n">${f0(x.ch)}${x.ch > 10 && p.role === 'dir_perf' ? ' <span class="flag">cap 10</span>' : ''}</td>` : ''}<td class="n">${f0(x.need)} h</td><td class="n">${f0(x.avail)} h</td><td>${busyBar(x.busy, thr(p))}</td></tr>`; }).join('') + `</tbody></table></div>${how('Hours needed adds up every process step for each of the person\'s clients, at their tier\'s frequencies. Available is their week less leave and team time. Busy = needed ÷ available; the tick is the role\'s line. Can take = clients they could add before the line. Rule = the role\'s own rule of thumb, red when exceeded.', 'who is full, who has room, and whose patch is the wrong size.')}</div>`;
  }

  // 3. Shared teams
  const vol = (stepId) => { const s0 = STEP[stepId]; let v = 0; for (const p of st.people) if (isCF(p) && p.counts) { const d = role(p).dept; if (!s0.proc.startsWith(d)) continue; for (const t of TIERS) v += (p.counts[t] || 0) * freqOf(s0, d, t, null); } for (const nc of st.named) if (s0.proc.startsWith(nc.dept)) v += freqOf(s0, nc.dept, 'T1', nc); return v; };
  const capUnits = (r, mins) => pool[r] ? pool[r].cap * S.roles[r].thr / (mins / 60) : 0;
  const unit = {
    content: [vol('o4') * 1000, capUnits('content', STEP.o4.min + STEP.o5.min) * 1000, 'words'],
    links: [vol('o7'), capUnits('links', STEP.o7.min + STEP.o9.min), 'links'],
    tech: [vol('o10'), pool.tech ? pool.tech.cap * S.roles.tech.thr : 0, 'ticket hours'],
  };
  h += `<div class="card sec"><div class="ch"><h2>Shared teams</h2><p>They serve every client and own none.</p></div><div class="grid g3">` +
    Object.keys(S.roles).filter(r => S.roles[r].kind === 'shared').map(r => { const pl = pool[r] || { total: 0, cap: 0, busy: 0 }; const u = unit[r]; return `<div class="team"><div class="ch"><h3>${S.roles[r].name}</h3><span class="pill ${cls(pl.busy || 0, S.roles[r].thr)}">${pc(pl.busy || 0)}</span></div><p class="small muted">${st.people.filter(p => p.role === r).map(p => esc(p.name)).join(', ')}</p>${u ? `<p class="small" style="margin-top:6px"><b class="num">${u[0] >= 1000 ? f0(u[0] / 1000) + 'k' : f0(u[0])}</b> of <span class="num">${u[1] >= 1000 ? f0(u[1] / 1000) + 'k' : f0(u[1])}</span> ${u[2]} a month at the line</p>` : ''}<div style="margin-top:6px">${busyBar(pl.busy || 0, S.roles[r].thr)}</div></div>`; }).join('') + `</div></div>`;

  // 4. Bottleneck
  const rank = Object.values(L).filter(x => availH(x.p, null) > 0).sort((a, b) => (b.busy - thr(b.p)) - (a.busy - thr(a.p)));
  const top = rank[0]; const topSteps = Object.entries(top.steps).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([s, v]) => ({ k: s === 'hand' ? 'Hand-holding' : STEP[s].name, v: v / top.p.speed }));
  h += `<div class="card sec"><div class="ch"><h2>Bottleneck</h2></div><div class="big"><b>${esc(top.p.name)}</b> (${esc(top.p.title)}) is the most stretched, at <b class="${top.busy >= thr(top.p) ? 'flag' : ''}">${pc(top.busy)}</b> against a line of ${pc(thr(top.p))}.</div><h3 style="margin:12px 0 6px">What fills their month</h3>${stackBar(topSteps)}<p class="small" style="margin-top:8px">These come from process steps assigned to them: ${Object.entries(top.steps).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([sid]) => sid === 'hand' ? 'hand-holding on their named clients' : `<a href="#process-${STEP[sid].proc}" data-act="openStep" data-step="${sid}">${esc(STEP[sid].name)}</a>`).join(', ')}.</p><p class="small muted" style="margin-top:10px">Next most stretched: ${rank.slice(1, 5).map(x => `${esc(x.p.name)} ${pc(x.busy)}`).join(' · ')}</p></div>`;

  // 5. If someone leaves
  const lv = st.people.find(p => p.id === UI.leaver && !p.gone) || st.people.find(p => p.id === 'diya');
  const after = (() => { const P = structuredClone(st.people), N = structuredClone(st.named); const l = P.find(p => p.id === lv.id); const moved = isCF(l) ? reassign(P, N, [], null, l, null) : []; l.gone = true; return { L2: loads(P, N, [], null, [], null).L, moved }; })();
  const changed = st.people.filter(p => !p.gone && p.id !== lv.id && Math.abs((after.L2[p.id].busy || 0) - L[p.id].busy) > 0.005).sort((a, b) => after.L2[b.id].busy - after.L2[a.id].busy);
  const goOver = changed.filter(p => after.L2[p.id].busy >= thr(p) && L[p.id].busy < thr(p));
  const recv = Object.entries(after.moved.reduce((a, x) => (a[x.to] = (a[x.to] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1]);
  h += `<div class="card sec"><div class="ch"><h2>What if someone leaves?</h2><label class="f" style="flex-direction:row;align-items:center;gap:8px"><span>Person</span><select data-ui="leaver">${st.people.filter(p => !p.gone).map(p => `<option value="${p.id}" ${p.id === lv.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>
    <div class="big">${isCF(lv) ? `If <b>${esc(lv.name)}</b> leaves, their ${f0(L[lv.id].clients)} clients go to ${recv.map(([id, n]) => `${esc(st.people.find(p => p.id === id).name)} (${n})`).join(', ') || 'nobody: no one else serves those tiers'}.` : `If <b>${esc(lv.name)}</b> leaves, the ${S.roles[lv.role].name.toLowerCase()} shares their work.`} ${goOver.length ? `<span class="flag">${goOver.map(p => esc(p.name)).join(', ')} go${goOver.length === 1 ? 'es' : ''} over their line.</span>` : 'Nobody new goes over their line.'}</div>
    <div class="dumbs" style="margin-top:12px">${changed.map(p => `<div class="drow"><span>${esc(p.name)}</span>${dumbbell(L[p.id].busy, after.L2[p.id].busy, thr(p))}</div>`).join('')}</div>
    <p class="small muted" style="margin-top:8px">A replacement takes about 3 months to reach full speed.</p>
    ${how('Takes the person out, then hands each of their clients to whichever colleague is least busy and serves that tier. Each row shows a colleague\'s busy share before (hollow dot) and after (solid dot); the grey line is their line.', 'key-person risk: who absorbs the loss, and whether you need a replacement or a rebalance.')}</div>`;

  // 6. Time to serve a client
  const cache = cacheFor([]);
  h += `<div class="card sec"><div class="ch"><h2>Time to serve one client, per month</h2></div>` + Object.keys(DEPTS).map(d => `<h3 style="margin:6px 0 8px">${DEPTS[d]}</h3><div class="grid g3" style="margin-bottom:14px">${TIERS.map(t => {
    const pur = {}; for (const it of cache[d + t]) { const k = STEP[it.step].purpose; pur[k] = (pur[k] || 0) + it.h; }
    const parts = Object.entries(pur).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v); const tot = parts.reduce((s, x) => s + x.v, 0);

    `<h3 style="margin:6px 0 8px">Named Tier 1 clients</h3><div class="tw"><table><thead><tr><th>Client</th><th>Looked after by</th><th class="n">Hours a month</th><th class="n">Earns per hour</th></tr></thead><tbody>${st.named.map(nc => { const hh = clientLoad(nc.dept, 'T1', nc, [], false).reduce((s, x) => s + x.h, 0); const o = st.people.find(p => p.id === nc.owner); return `<tr><td>${esc(nc.name)}${nc.note ? `<div class="small muted">${esc(nc.note)}</div>` : ''}</td><td>${esc(o ? o.name : '—')}</td><td class="n">${f1(hh)}</td><td class="n">${money(nc.fee / hh)}</td></tr>`; }).join('')}</tbody></table></div>
    ${how('Adds up every step of the monthly servicing process for one client of the tier, all roles together, using the tier\'s meetings, words, links, ad-hoc chance and so on. Named Tier 1 clients use their own values.', 'what takes the time, and which clients earn the most per hour of effort.')}</div>`;

  // 7. Next 12 months
  const roles = Object.keys(S.roles);
  const rows = roles.map(r => { const vals = sim.months.map(rec => roleBusy(rec, r)); const mi = vals.findIndex(v => v >= S.roles[r].thr); return { r, vals, mi }; });
  const todo = rows.filter(x => x.mi >= 0).sort((a, b) => a.mi - b.mi);
  h += `<div class="card sec"><div class="ch"><h2>The next 12 months</h2></div>

function scenarioResults(scn) {

  const hours = Object.values(L).reduce((s, x) => s + Object.values(x.steps).reduce((a, b) => a + b, 0), 0);
  const overMonths = sim.months.reduce((s, rec) => s + Object.values(rec.L).filter(x => x.avail > 0 && x.busy >= thr(x.p)).length, 0);

}

function playToChanges(P) {
  const c = [];

  if (+P.leads) c.push({ type: 'leads', x: 1 + P.leads / 100, start: +P.marketFrom });
  if (+P.win) c.push({ type: 'win', x: 1 + P.win / 100, start: +P.marketFrom });
  if (+P.churn) c.push({ type: 'churn', x: 1 + P.churn / 100 });
  for (const [d, n] of [['org', +P.addOrg], ['perf', +P.addPerf]]) {

    if (P.addTier !== 'mix') { c.push({ type: 'add', dept: d, tier: P.addTier, n: total, start: +P.addFrom, spread: +P.addMonths }); continue; }
    let left = total; const parts = TIERS.map(t => ({ t, x: total * (S.demand.tierMix[t] || 0) })); parts.forEach(p => { p.n = Math.floor(p.x); left -= p.n; });
    parts.sort((a, b) => (b.x - b.n) - (a.x - a.n)); for (let i = 0; i < left; i++) parts[i % parts.length].n++;
    for (const p of parts) if (p.n) c.push({ type: 'add', dept: d, tier: p.t, n: p.n, start: +P.addFrom, spread: +P.addMonths });
  }
  if (+P.price) c.push({ type: 'fee', dept: 'all', tier: P.priceTier, pct: +P.price, start: +P.priceFrom, sens: +P.priceSens });
  for (const l of P.leavers) c.push({ type: 'leave', person: l.person, start: +l.month });
  for (const x of P.hires) c.push({ type: 'hire', role: x.role, start: +x.month });
  for (const x of P.lose) c.push({ type: 'loseNamed', id: x.id, start: +x.month });
  for (const id in P.autos) c.push({ type: 'lib', lib: id, start: +P.autos[id], ramp: 1 });
  return c;
}

document.addEventListener('click', e => {
