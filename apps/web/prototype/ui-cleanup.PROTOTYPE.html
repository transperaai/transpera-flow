<!--
  PROTOTYPE — throwaway. Question: "What should Transpera Flow's pages look like once the layout is cleaned up?"
  (docs/plans/ui-cleanup.md). Three structurally different layout systems, each applied to six key pages, on the
  app's own tokens (apps/web/src/styles/tokens.css). Fake, read-only data. Switch with the bottom bar or ← / →.

<style>
/* Layout: an app shell that fills the frame; each variant owns its own chrome. Tokens copied from the app. */
:root {
  --bg: oklch(0.985 0 0); --panel: oklch(1 0 0); --panel-2: oklch(0.97 0 0);
  --line: oklch(0.922 0 0); --line-2: oklch(0.87 0 0);
  --fg: oklch(0.145 0 0); --fg-2: oklch(0.44 0 0); --fg-3: oklch(0.53 0 0);
  --accent: oklch(0.52 0.105 223.128); --accent-soft: oklch(0.95 0.025 215); --accent-fg: oklch(0.984 0.019 200.873);
  --good: #1baf7a; --warn: #eda100; --crit: #e34948;
  --good-soft: #d8f3e8; --warn-soft: #fdf0d1; --crit-soft: #fbe1e0;
  --edit: #6d3fc4; --edit-soft: #ece4fa;
  --rate-great: oklch(0.6 0.14 155); --rate-good: oklch(0.72 0.16 128);
  --chart-1: oklch(0.865 0.127 207.078); --chart-2: oklch(0.715 0.143 215.221); --chart-3: oklch(0.609 0.126 221.723); --chart-4: oklch(0.52 0.105 223.128); --chart-5: oklch(0.45 0.085 224.283);
  --p-upkeep: oklch(0.75 0.08 205); --p-winning: oklch(0.68 0.15 305); --p-required: oklch(0.62 0.05 250); --p-coord: oklch(0.72 0.13 345);
  --switch-bg: oklch(0.2 0 0); --switch-fg: oklch(0.98 0 0);

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --space-page: 24px; --space-panel: 16px;
}

  --accent: oklch(0.715 0.143 215.221); --accent-soft: oklch(0.3 0.05 225); --accent-fg: oklch(0.2 0.04 229.695);
  --good: #199e70; --warn: #c98500; --crit: #e66767; --good-soft: #153f30; --warn-soft: #45360f; --crit-soft: #4a2424;
  --edit: #a37ef0; --edit-soft: #2e2248; --rate-great: oklch(0.66 0.14 155); --rate-good: oklch(0.75 0.15 128);

  --fg: oklch(0.985 0 0); --fg-2: oklch(0.76 0 0); --fg-3: oklch(0.68 0 0);
  --accent: oklch(0.715 0.143 215.221); --accent-soft: oklch(0.3 0.05 225); --accent-fg: oklch(0.2 0.04 229.695);

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.mono { font-family: var(--mono); }

/* Type scale (the plan's five roles) */
.t-page { font-size: 22px; line-height: 28px; font-weight: 600; }
.t-section { font-size: 15px; line-height: 22px; font-weight: 600; }
.t-label { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-2); }
.t-caption { font-size: 12px; line-height: 16px; color: var(--fg-2); }
.prose { max-width: 68ch; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-2); background: var(--panel); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn .edit-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--edit); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-ctl); padding: 2px; background: var(--panel-2); gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.input { height: 32px; border: 1px solid var(--line-2); border-radius: var(--r-ctl); background: var(--panel); padding: 0 10px; font-size: 13px; min-width: 0; }
.input.xs { width: 7.5rem; } .input.md { width: min(100%, 28rem); } .input.search { width: min(100%, 20rem); }
.unit { display: inline-flex; align-items: center; gap: 8px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }

/* Surfaces */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: var(--space-panel); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel.flush { padding: 0; overflow: hidden; }
.panel-h { display: flex; align-items: baseline; gap: 8px; }
.panel-h .t-section { flex: 1; }
.panel-h a, .link { color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 500; cursor: pointer; }
.help { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); font-size: 10px; color: var(--fg-3); cursor: help; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--panel-2); color: var(--fg-2); }
.pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.great { background: var(--good-soft); color: var(--rate-great); }
.pill.good { background: var(--good-soft); color: var(--rate-good); }
.pill.bad { background: var(--warn-soft); color: var(--warn); }
.pill.risk { background: var(--crit-soft); color: var(--crit); }
.pill.live { background: var(--accent-soft); color: var(--accent); }
.pill.draft { background: var(--edit-soft); color: var(--edit); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.great { background: var(--rate-great); } .dot.good { background: var(--rate-good); } .dot.bad { background: var(--warn); } .dot.risk { background: var(--crit); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--fg-2); }
.kpi.warn { box-shadow: inset 3px 0 0 var(--warn); } .kpi.crit { box-shadow: inset 3px 0 0 var(--crit); } .kpi.good { box-shadow: inset 3px 0 0 var(--good); }
.kpis.flat { gap: 0; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--panel); overflow: hidden; }
.kpis.flat .kpi { border: 0; border-radius: 0; border-left: 1px solid var(--line); margin-left: -1px; }

/* Tables */
.tw { overflow-x: auto; min-width: 0; }
table.dt { width: 100%; border-collapse: collapse; font-size: 13px; }
.dt th { text-align: left; font-size: 12px; font-weight: 500; color: var(--fg-2); padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
.dt th.sort::after { content: " ↕"; color: var(--fg-3); }
.dt td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dt tr:last-child td { border-bottom: 0; }
.dt tbody tr:hover { background: var(--panel-2); cursor: pointer; }
.dt td.r, .dt th.r { text-align: right; }
.dt .name { font-weight: 500; }

/* Bars */
.bars { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(0, 28rem) 3rem; gap: 8px 12px; align-items: center; font-size: 13px; }
.bar { height: 8px; border-radius: 4px; background: var(--panel-2); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.heat { display: grid; gap: 3px; font-size: 12px; align-items: center; }
.heat .c { height: 26px; border-radius: 5px; display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; }

/* Canvas */
.canvas { position: relative; background-color: var(--bg); background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 18px 18px; min-height: 0; min-width: 0; overflow: hidden; }
.canvas svg { width: 100%; height: 100%; display: block; }
.canvas .ctl { position: absolute; display: flex; gap: 6px; align-items: center; }
.node rect { fill: var(--panel); stroke: var(--line-2); }
.node.sel rect { stroke: var(--accent); stroke-width: 2; }
.node text { fill: var(--fg); font: 600 12px var(--font); }
.node text.s { fill: var(--fg-2); font: 400 11px var(--font); }
.edge { stroke: var(--line-2); stroke-width: 1.5; fill: none; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { height: 38px; padding: 0 12px; border: 0; background: none; font-size: 13px; font-weight: 500; color: var(--fg-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; background: var(--panel-2); border-radius: 999px; padding: 1px 6px; margin-left: 4px; color: var(--fg-2); }

/* Forms */
.frow { display: grid; grid-template-columns: minmax(10rem, 14rem) minmax(0, 1fr); gap: 4px 24px; padding: 14px 0; border-top: 1px solid var(--line); }
.frow:first-of-type { border-top: 0; }
.frow .lbl { font-weight: 500; font-size: 13px; }
.frow .hint { font-size: 12px; color: var(--fg-2); margin-top: 4px; }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }
.saved::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-ctl); cursor: pointer; min-width: 0; }
.li:hover { background: var(--panel-2); }
.li.sel { background: var(--accent-soft); }
.li .main { flex: 1; min-width: 0; }
.li .main b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .main small { color: var(--fg-2); font-size: 12px; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 13px; }
.dl dt { color: var(--fg-2); } .dl dd { margin: 0; font-weight: 500; }
details.lever { border-top: 1px solid var(--line); padding: 10px 0; }
details.lever summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; display: flex; justify-content: space-between; }
details.lever summary::after { content: "▾"; color: var(--fg-3); }
details.lever[open] summary::after { content: "▴"; }
.lv { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; margin-top: 10px; }
.lv input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.verdict { font-size: 17px; line-height: 24px; font-weight: 500; }
.verdict b { color: var(--crit); font-weight: 600; }

/* ============ Variant A: fluid pages ============ */
.A { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; }
.A .side { border-right: 1px solid var(--line); background: var(--bg); padding: 12px 10px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 4px 6px; }
.mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
.mark::after { content: ""; width: 8px; height: 8px; border: 2px solid var(--accent-fg); border-radius: 50%; }
.ws { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 6px 10px; font-size: 13px; font-weight: 500; background: var(--panel); }
.nav-g { display: flex; flex-direction: column; gap: 1px; }
.nav-g .t-label { padding: 4px 8px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; color: var(--fg-2); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; }
.nav svg { width: 16px; height: 16px; flex: none; }
.nav:hover { background: var(--panel-2); color: var(--fg); }
.nav.on { background: var(--panel-2); color: var(--fg); }
.nav .n { margin-left: auto; font-size: 11px; color: var(--fg-3); }
.A .mainc { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.A .crumbs { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 var(--space-page); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.A .crumbs b { color: var(--fg); font-weight: 500; }
.A .scroll { flex: 1; overflow-y: auto; min-height: 0; }
.A .page { padding: var(--space-page); display: flex; flex-direction: column; gap: 20px; }
.ph { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.ph .tt { flex: 1; min-width: 16rem; display: flex; flex-direction: column; gap: 4px; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.g12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s8 { grid-column: span 8; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s5 { grid-column: span 5; } .s12 { grid-column: span 12; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.wb { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.wb-bar { display: flex; align-items: center; gap: 12px; padding: 8px var(--space-page); border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--panel); }
.wb-body { display: grid; min-height: 0; }
.pane { overflow-y: auto; min-height: 0; min-width: 0; }
.pane.r { border-left: 1px solid var(--line); background: var(--panel); }
.pane.l { border-right: 1px solid var(--line); background: var(--panel); }
.resize { cursor: col-resize; }
.settings-l { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
.subnav { display: flex; flex-direction: column; gap: 1px; position: sticky; top: 0; }
.detail-l { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 24px; align-items: start; }
.rail { position: sticky; top: 0; }

/* ============ Variant B: panes ============ */
.B { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: 100%; }
.B .irail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; background: var(--bg); }
.B .irail .mark { margin-bottom: 10px; }
.ib { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; color: var(--fg-2); cursor: pointer; position: relative; }
.ib svg { width: 18px; height: 18px; }
.ib:hover { background: var(--panel-2); color: var(--fg); }
.ib.on { background: var(--accent-soft); color: var(--accent); }
.ib .n { position: absolute; top: 3px; right: 2px; font-size: 9px; background: var(--warn); color: #000; border-radius: 999px; padding: 0 4px; font-weight: 700; }
.B .panes { display: grid; min-width: 0; min-height: 0; height: 100%; }
.B .lp { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.B .lp-h { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.B .lp-b { overflow-y: auto; padding: 6px; flex: 1; }
.B .mp { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.B .mp-h { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.chips { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); pointer-events: auto; }
.chip .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .s { font-size: 11px; color: var(--fg-2); }
.drawer { border-top: 1px solid var(--line); background: var(--panel); }
.split-h { display: grid; grid-template-rows: minmax(0, 45%) 6px minmax(0, 1fr); min-height: 0; flex: 1; }
.grip { background: var(--line); cursor: row-resize; }

/* ============ Variant C: top nav + tabs ============ */
.C { display: flex; flex-direction: column; height: 100%; }
.C .top { height: 52px; flex: none; display: flex; align-items: center; gap: 20px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.C .top nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; }
.C .top nav a { padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--fg-2); cursor: pointer; white-space: nowrap; }
.C .top nav a.on { color: var(--fg); background: var(--panel-2); }
.C .body { flex: 1; overflow-y: auto; min-height: 0; }
.band { background: var(--panel); border-bottom: 1px solid var(--line); }
.band-in { padding: 24px 32px 0; display: flex; flex-direction: column; gap: 16px; }
.band .ey { font-size: 12px; color: var(--fg-2); }
.band .answer { font-size: 15px; color: var(--fg-2); max-width: 72ch; }
.band .answer b { color: var(--fg); font-weight: 600; }
.band .tabs { border-bottom: 0; margin: 0 -12px; }
.bigk { display: flex; gap: 40px; flex-wrap: wrap; }
.bigk div { display: flex; flex-direction: column; }
.bigk .v { font-size: 28px; line-height: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bigk .s { font-size: 12px; color: var(--fg-2); }
.C .content { padding: 24px 32px 96px; display: flex; flex-direction: column; gap: 20px; }
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 16px; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.pcard:hover { border-color: var(--line-2); }
.pcard .thumb { height: 120px; border-bottom: 1px solid var(--line); }
.pcard .meta { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.lever-strip { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 16px; }

function processMap({ sel = 2, compact = false } = {}) {

function lineChart(title, a, b, fmt, h = 180) {

  const all = a.concat(b), lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.15 || 1, y0 = lo - pad, y1 = hi + pad;
  const X = (i) => L + i * (W - L - R) / (a.length - 1), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const path = (s) => s.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  const ticks = [y0 + pad, (y0 + y1) / 2, y1 - pad];
  const months = ["Nov", "Feb", "May", "Aug", "Oct"], mi = [0, 3, 6, 9, 11];
  return `<div class="panel"><div class="panel-h"><span class="t-section">${title}</span><span class="help" title="How this works">?</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${title}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end" style="fill:var(--fg-3);font:11px var(--font)">${fmt(t)}</text>`).join("")}

}

// ---------- Router + switcher ----------
const VARIANTS = { a: A, b: B, c: C };
const VKEYS = ["a", "b", "c"];
const PAGES = [["overview", "Overview"], ["processes", "Processes"], ["process", "Process page"], ["sandbox", "Sandbox"], ["settings", "Settings"], ["issue", "Issue detail"]];
function navTarget(k) { return { overview: "overview", processes: "processes", issues: "issue", sandbox: "sandbox", settings: "settings" }[k] || state.page; }
const state = { v: "a", page: "overview" };
function readHash() { const m = /^#([abc])-([a-z]+)$/.exec(location.hash); if (m && PAGES.some(p => p[0] === m[2])) { state.v = m[1]; state.page = m[2]; } }
function go(v, page) { state.v = v; state.page = page; const h = `#${v}-${page}`; if (location.hash !== h) history.replaceState(null, "", h); render(); }
const sel = document.getElementById("pagesel");
sel.innerHTML = PAGES.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
function render() {
  const V = VARIANTS[state.v];
  document.getElementById("app").innerHTML = V[state.page]();
  document.getElementById("vlab").innerHTML = `${state.v.toUpperCase()} <small>${V.name}</small>`;
  sel.value = state.page;
}
const cycle = (d) => go(VKEYS[(VKEYS.indexOf(state.v) + d + 3) % 3], state.page);
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
sel.onchange = () => go(state.v, sel.value);
document.getElementById("theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
document.addEventListener("keydown", (e) => { const t = e.target; if (t.closest && t.closest("input,textarea,select,[contenteditable]")) return; if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(state.v, g.dataset.go); return; }
  const tb = e.target.closest(".tabs button, .seg button"); if (tb) { const sib = tb.parentElement.querySelectorAll("button"); const attr = tb.closest(".tabs") ? "aria-selected" : "aria-pressed"; sib.forEach(b => b.setAttribute(attr, String(b === tb))); }
});
addEventListener("hashchange", () => { readHash(); render(); });
readHash(); render();
</script>
